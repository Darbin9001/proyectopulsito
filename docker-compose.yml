version: '3.8'

services:

  # ======================
  # 🖥️ Frontend
  # ======================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    ports:
      - "5000:5000"
    environment:
      - API_GATEWAY_URL=http://api-gateway:8000
      - MONGO_URI=${MONGO_URI}
      - DB_NAME=${DB_NAME}
      - TZ=America/Bogota
    depends_on:
      - api-gateway
    networks:
      - app-network

  # ======================
  # 🔀 API Gateway
  # ======================
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - NAME1_SERVICE_URL=http://service1-service:8002
      - NAME2_SERVICE_URL=http://service2-service:8003
      - TZ=America/Bogota
    depends_on:
      - auth-service
      - service1-service
      - service2-service
    networks:
      - app-network

  # ======================
  # 🔐 Servicio de Autenticación
  # ======================
  auth-service:
    build:
      context: .
      dockerfile: services/authentication/Dockerfile
    container_name: auth-service
    ports:
      - "8001:8001"
    environment:
      - MONGO_URI=${MONGO_URI}
      - DB_NAME=${DB_NAME}
      - TZ=America/Bogota
    networks:
      - app-network

  # ======================
  # 🩺 Servicio 1 (Pacientes)
  # ======================
  service1-service:
    build:
      context: .
      dockerfile: services/service1/Dockerfile
    container_name: service1-service
    ports:
      - "8002:8002"
    environment:
      - MONGO_URI=${MONGO_URI}
      - DB_NAME=${DB_NAME}
      - TZ=America/Bogota
    networks:
      - app-network

  # ======================
  # 📊 Servicio 2 (Análisis)
  # ======================
  service2-service:
    build:
      context: .
      dockerfile: services/service2/Dockerfile
    container_name: service2-service
    ports:
      - "8003:8003"
    environment:
      - NAME1_SERVICE_URL=http://service1-service:8002
      - TZ=America/Bogota
    volumes:
      - ./data_history.json:/app/data_history.json
    networks:
      - app-network

  # ======================
  # 🤖 Agente de Telegram
  # ======================
  telegram-agent:
    build:
      context: .
      dockerfile: my_agent/Dockerfile
    container_name: telegram-agent
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - SERVICE2_URL=http://service2-service:8003
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TZ=America/Bogota
    depends_on:
      - service2-service
    networks:
      - app-network
    restart: unless-stopped

  # ======================
  # 🧪 Generador Automático de Datos
  # ======================
  data-generator:
    build:
      context: .
      dockerfile: services/pacientes/Dockerfile
    container_name: data-generator
    environment:
      - SERVICE1_URL=http://service1-service:8002/health-data
      - SERVICE2_URL=http://service2-service:8003/analyze
      - TZ=America/Bogota
    depends_on:
      - service1-service
      - service2-service
    networks:
      - app-network
    restart: unless-stopped

# ======================
# 🌐 Red
# ======================
networks:
  app-network:
    driver: bridge
