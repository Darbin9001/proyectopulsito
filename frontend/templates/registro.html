<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Sistema de Monitoreo de Salud</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .register-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 40px;
      max-width: 550px;
      width: 100%;
      animation: fadeIn 0.5s ease-in;
      max-height: 90vh;
      overflow-y: auto;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      color: #667eea;
      font-size: 2em;
      margin-bottom: 10px;
    }

    .logo p {
      color: #666;
      font-size: 0.9em;
    }

    .role-selector {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }

    .role-option {
      flex: 1;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .role-option:hover {
      border-color: #667eea;
      background: #f5f7ff;
    }

    .role-option.active {
      border-color: #667eea;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .role-option input[type="radio"] {
      display: none;
    }

    .role-icon {
      font-size: 2em;
      margin-bottom: 5px;
    }

    .role-label {
      font-weight: 600;
      font-size: 1.1em;
    }

    .form-row {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }

    .form-group {
      flex: 1;
      margin-bottom: 20px;
    }

    .form-row .form-group {
      margin-bottom: 0;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1em;
      transition: all 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-group small {
      display: block;
      margin-top: 5px;
      color: #999;
      font-size: 0.85em;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .alert {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 500;
    }

    .alert-error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef5350;
    }

    .alert-success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #66bb6a;
    }

    .hidden {
      display: none;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .login-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .required {
      color: #f44336;
    }

    /* Campos específicos para médico */
    .medico-only {
      display: none;
    }

    .medico-only.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="logo">
      <h1>🩺 Monitor de salud</h1>
      <p>Registro de Nuevo Usuario</p>
    </div>

    <div id="alert" class="alert hidden"></div>

    <!-- Selector de Rol -->
    <div class="role-selector">
      <label class="role-option active">
        <input type="radio" name="rol" value="paciente" checked />
        <div class="role-icon">🧑‍⚕️</div>
        <div class="role-label">Paciente</div>
      </label>
      
      <label class="role-option">
        <input type="radio" name="rol" value="medico" />
        <div class="role-icon">👨‍⚕️</div>
        <div class="role-label">Médico</div>
      </label>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label for="cedula">Cédula <span class="required">*</span></label>
        <input 
          type="text" 
          id="cedula" 
          name="cedula" 
          placeholder="Número de cédula"
          required
          pattern="[0-9a-zA-Z]+"
          title="Solo números y letras"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre <span class="required">*</span></label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            placeholder="Nombre"
            required
          />
        </div>

        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input 
            type="text" 
            id="apellido" 
            name="apellido" 
            placeholder="Apellido"
          />
        </div>
      </div>

      <!-- Campo específico para pacientes -->
      <div class="form-group paciente-only">
        <label for="fecha_nacimiento">Fecha de Nacimiento</label>
        <input 
          type="date" 
          id="fecha_nacimiento" 
          name="fecha_nacimiento"
        />
      </div>

      <!-- Campo específico para médicos -->
      <div class="form-group medico-only">
        <label for="especialidad">Especialidad <span class="required">*</span></label>
        <select id="especialidad" name="especialidad">
          <option value="">Seleccione una especialidad</option>
          <option value="Cardiología">Cardiología</option>
          <option value="Medicina General">Medicina General</option>
          <option value="Pediatría">Pediatría</option>
          <option value="Neurología">Neurología</option>
          <option value="Dermatología">Dermatología</option>
          <option value="Ginecología">Ginecología</option>
          <option value="Traumatología">Traumatología</option>
          <option value="Oftalmología">Oftalmología</option>
          <option value="Psiquiatría">Psiquiatría</option>
          <option value="Otra">Otra</option>
        </select>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico <span class="required">*</span></label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="correo@ejemplo.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono <span class="required">*</span></label>
        <input 
          type="tel" 
          id="telefono" 
          name="telefono" 
          placeholder="3001234567"
          required
          pattern="[0-9]{10}"
          title="Debe ser un número de 10 dígitos"
        />
      </div>

      <!-- Campo solo para pacientes -->
      <div class="form-group paciente-only">
        <label for="telegram_user_id">Telegram User ID</label>
        <input 
          type="text" 
          id="telegram_user_id" 
          name="telegram_user_id" 
          placeholder="Opcional"
        />
        <small>Si tienes cuenta de Telegram, puedes ingresar tu ID</small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña <span class="required">*</span></label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Mínimo 6 caracteres"
          required
          minlength="6"
        />
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirmar Contraseña <span class="required">*</span></label>
        <input 
          type="password" 
          id="confirm-password" 
          name="confirm-password" 
          placeholder="Repita la contraseña"
          required
        />
      </div>

      <button type="submit" class="btn">Registrarse</button>
    </form>

    <div class="login-link">
      ¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a>
    </div>
  </div>

  <script>
    const registerForm = document.getElementById('register-form');
    const alertDiv = document.getElementById('alert');
    const roleOptions = document.querySelectorAll('.role-option');
    const roleRadios = document.querySelectorAll('input[name="rol"]');
    const pacienteFields = document.querySelectorAll('.paciente-only');
    const medicoFields = document.querySelectorAll('.medico-only');

    // Función para mostrar/ocultar campos según el rol
    function toggleRoleFields(rol) {
      if (rol === 'medico') {
        pacienteFields.forEach(field => field.classList.add('hidden'));
        medicoFields.forEach(field => field.classList.add('show'));
        
        // Hacer especialidad requerida
        document.getElementById('especialidad').required = true;
        document.getElementById('fecha_nacimiento').required = false;
      } else {
        pacienteFields.forEach(field => field.classList.remove('hidden'));
        medicoFields.forEach(field => field.classList.remove('show'));
        
        // Hacer especialidad no requerida
        document.getElementById('especialidad').required = false;
        document.getElementById('fecha_nacimiento').required = false;
      }
    }

    // Manejar selección de rol
    roleOptions.forEach(option => {
      option.addEventListener('click', function() {
        // Remover active de todos
        roleOptions.forEach(opt => opt.classList.remove('active'));
        // Agregar active al seleccionado
        this.classList.add('active');
        
        // Seleccionar el radio button correspondiente
        const radio = this.querySelector('input[type="radio"]');
        radio.checked = true;
        
        // Actualizar campos visibles
        toggleRoleFields(radio.value);
      });
    });

    function showAlert(message, type = 'error') {
      alertDiv.textContent = message;
      alertDiv.className = `alert alert-${type}`;
      alertDiv.classList.remove('hidden');
      
      setTimeout(() => {
        alertDiv.classList.add('hidden');
      }, 5000);
    }

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const rol = document.querySelector('input[name="rol"]:checked').value;
      const cedula = document.getElementById('cedula').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const apellido = document.getElementById('apellido').value.trim();
      const email = document.getElementById('email').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      // Campos específicos
      const fecha_nacimiento = document.getElementById('fecha_nacimiento').value;
      const telegram_user_id = document.getElementById('telegram_user_id').value.trim();
      const especialidad = document.getElementById('especialidad').value;

      // Validaciones básicas
      if (!cedula || !nombre || !email || !telefono || !password) {
        showAlert('Por favor complete todos los campos obligatorios', 'error');
        return;
      }

      // Validación específica para médico
      if (rol === 'medico' && !especialidad) {
        showAlert('Por favor seleccione una especialidad', 'error');
        return;
      }

      if (!/^\d{10}$/.test(telefono)) {
        showAlert('El teléfono debe tener 10 dígitos', 'error');
        return;
      }

      if (password.length < 6) {
        showAlert('La contraseña debe tener al menos 6 caracteres', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('Las contraseñas no coinciden', 'error');
        return;
      }

      // Preparar datos según el rol
      const data = {
        cedula,
        nombre,
        email,
        telefono,
        password,
        rol,
        apellido
      };

      // Agregar campos específicos
      if (rol === 'paciente') {
        data.fecha_nacimiento = fecha_nacimiento;
        data.telegram_user_id = telegram_user_id;
      } else if (rol === 'medico') {
        data.especialidad = especialidad;
      }

      try {
        const response = await fetch('/registro', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok && result.success) {
          showAlert(`¡Registro exitoso como ${rol}! Redirigiendo al login...`, 'success');
          
          setTimeout(() => {
            window.location.href = '/login';
          }, 2000);
        } else {
          showAlert(result.message || 'Error al registrarse', 'error');
        }
      } catch (error) {
        showAlert('Error al conectar con el servidor', 'error');
        console.error('Error:', error);
      }
    });

    // Inicializar vista
    toggleRoleFields('paciente');
  </script>
</body>
</html>
